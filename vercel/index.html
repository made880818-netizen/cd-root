<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD ROOT</title>
<meta name="description" content="CSV를 올리면 이상 구간을 찾고, AI 에이전트가 원인 후보를 토론하는 분석 서비스">
<style>
  :root { --bg:#070b12; --fg:#e6edf6; --mut:#8a98ad; --acc:#38e1ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,"Malgun Gothic",sans-serif; }
  main { min-height:100%; display:grid; place-content:center; text-align:center; padding:0 16px; gap:14px; }
  h1 { margin:0; letter-spacing:.12em; font-size:clamp(28px,6vw,48px); }
  p { margin:0; color:var(--mut); font-size:clamp(14px,2.4vw,18px); }
  a.go { justify-self:center; margin-top:10px; padding:14px 28px; border-radius:10px; background:var(--acc); color:#04141a; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>CD ROOT</h1>
  <p>CSV를 올리면 이상 구간을 찾고, AI 에이전트가 원인 후보를 토론합니다.</p>
  <a class="go" id="open" href="#">앱 열기 →</a>
  <p id="msg">잠시 후 자동으로 이동합니다…</p>
</main>
<script src="config.js"></script>
<script>
  var url = window.CDROOT_APP_URL;
  document.getElementById("open").href = url;
  setTimeout(function () { location.replace(url); }, 1200);   // streamlit.app은 iframe 임베드가 브라우저에서 막혀 바로 이동시킨다
</script>
</body>
</html>
